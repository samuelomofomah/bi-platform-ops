name: nightly-ops

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC = 02:00 in Toronto during daylight time
  workflow_dispatch:
    inputs:
      task:
        description: Which task to run
        type: choice
        options: [all, health, collect, backup, refresh]
        default: all

permissions:
  id-token: write              # lets the job assume an AWS role through OIDC, no stored keys
  contents: read

jobs:
  ops:
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env }}          # each environment holds its own secrets
    runs-on: [self-hosted, linux, bi-ops]   # inside the network, next to the BI servers
    env:
      BIOPS_ENV: ${{ matrix.env }}
      BIOPS_DB: /var/lib/biops/biops.db     # persistent path on the runner
      BIOPS_BACKUP_DIR: /var/lib/biops/backups
      BIOPS_S3_BUCKET: ${{ vars.BIOPS_S3_BUCKET }}
      BIOPS_SNS_TOPIC_ARN: ${{ vars.BIOPS_SNS_TOPIC_ARN }}
      TABLEAU_URL: ${{ secrets.TABLEAU_URL }}
      TABLEAU_SITE: ${{ vars.TABLEAU_SITE }}
      TABLEAU_PAT_NAME: ${{ secrets.TABLEAU_PAT_NAME }}
      TABLEAU_PAT_SECRET: ${{ secrets.TABLEAU_PAT_SECRET }}
      TABLEAU_REFRESH_DATASOURCES: ${{ vars.TABLEAU_REFRESH_DATASOURCES }}
      MSTR_URL: ${{ secrets.MSTR_URL }}
      MSTR_USER: ${{ secrets.MSTR_USER }}
      MSTR_PASSWORD: ${{ secrets.MSTR_PASSWORD }}
      MSTR_REFRESH_CUBES: ${{ vars.MSTR_REFRESH_CUBES }}
      TASK: ${{ inputs.task || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ca-central-1
      - name: Host health
        if: env.TASK == 'all' || env.TASK == 'health'
        run: ./scripts/linux_health.sh
      - name: Platform health
        if: env.TASK == 'all' || env.TASK == 'health'
        run: python -m biops health
      - name: Collect inventory and usage
        if: env.TASK == 'all' || env.TASK == 'collect'
        run: python -m biops collect
      - name: Backup
        if: env.TASK == 'all' || env.TASK == 'backup'
        run: python -m biops backup
      - name: Refresh
        if: env.TASK == 'all' || env.TASK == 'refresh'
        run: python -m biops refresh
